services:
  uni-api-web:
    container_name: uni-api-web
    image: ghcr.io/yosefzhang/uni-api-web:latest
    network_mode: bridge
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "9210:8000"
    volumes:
      - ./api.yaml:/home/api.yaml
      - ./data:/home/data