services:
  uniapi-frontend:
    image: uniapi-frontend:latest
    ports:
      - "19212:19212"
    environment:
      - NODE_ENV=production
      - PORT=19212
      - API_YAML_PATH=/app/api.yaml
      - STATS_DB_TYPE=sqlite
      - STATS_DB_PATH=/app/data/stats.db
    volumes:
      # api.yaml 可写：在线配置「保存」需要写回磁盘
      - /path/to/your/uniapi/api.yaml:/app/api.yaml
      # 统计数据库只读：uni-api-status 仅做查询
      - /path/to/your/uniapi/data:/app/data:ro
    restart: unless-stopped
    container_name: uniapi-frontend
