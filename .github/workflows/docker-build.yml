name: Build and Publish Image

on:
  push:
    branches: [main]
    paths:
      - webui/package.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-build.yml
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Resolve image version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read webui version
        id: meta
        run: |
          VERSION=$(node -p "require('./webui/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image version: $VERSION"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=uni-api-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=uni-api-${{ matrix.platform_pair }},ignore-error=true

      - name: Export platform digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifest
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifests
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          SOURCES=()
          for digest_file in *; do
            SOURCES+=("${GHCR_IMAGE}@sha256:${digest_file}")
          done

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            --tag "${GHCR_IMAGE}:${VERSION}" \
            "${SOURCES[@]}"

      - name: Verify published platforms
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          verify_platforms() {
            local image="$1"
            local platforms
            platforms=$(docker buildx imagetools inspect "$image" --raw | \
              jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' | \
              sort -u)
            diff -u <(printf '%s\n' linux/amd64 linux/arm64) <(printf '%s\n' "$platforms")
          }

          verify_platforms "${GHCR_IMAGE}:${VERSION}"
          verify_platforms "${GHCR_IMAGE}:latest"
