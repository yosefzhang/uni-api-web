name: Docker Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - main.py
      - fugue_observability.py
      - db.py
      - routing.py
      - upstream.py
      - utils.py
      - core/**
      - core
      - uni_api/**
      - uni_api
      - static/**
      - Dockerfile
      - .dockerignore
      - rust/**
      - pyproject.toml
      - uv.lock
      - docker-compose.yml
      - .github/workflows/main.yml
      - .github/workflows/release.yml
      - .gitmodules
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version and release sha
        id: prepare
        run: |
          VERSION=$(grep "^version = " pyproject.toml | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_COMMIT=${{ needs.prepare.outputs.release_sha }}
          tags: |
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=uni-api-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=uni-api-${{ matrix.platform_pair }},ignore-error=true

      - name: Export platform digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifests
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SOURCES=()
          for digest_file in *; do
            SOURCES+=("${GHCR_IMAGE}@sha256:${digest_file}")
          done

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            --tag "${GHCR_IMAGE}:${VERSION}" \
            "${SOURCES[@]}"

      - name: Verify published platforms
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          verify_platforms() {
            local image="$1"
            local platforms
            platforms=$(docker buildx imagetools inspect "$image" --raw | \
              jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' | \
              sort -u)
            diff -u <(printf '%s\n' linux/amd64 linux/arm64) <(printf '%s\n' "$platforms")
          }

          verify_platforms "${GHCR_IMAGE}:${VERSION}"
          verify_platforms "${GHCR_IMAGE}:latest"